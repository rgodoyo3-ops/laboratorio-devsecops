name: DevSecOps Complete Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # SAST - Static Application Security Testing
  sast-scan:
    name: SAST - Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
          generateSarif: "1"

  sast-quality-gate:
    name: SAST Quality Gate
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - run: echo "SAST Quality Gate Passed"

  # SCA - Software Composition Analysis
  sca-scan:
    name: SCA - Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - name: npm audit
        run: |
          npm install
          npm audit --audit-level=high --json > audit.json || true
      - uses: actions/upload-artifact@v3
        with:
          name: audit-results
          path: audit.json

  sca-quality-gate:
    name: SCA Quality Gate
    runs-on: ubuntu-latest
    needs: sca-scan
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: audit-results
      - name: Check vulnerabilities
        run: |
          if grep -q '"severity":"critical"' audit.json; then
            echo "Critical vulnerabilities found!"
            exit 1
          fi

  # Build and Deploy for DAST
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [sast-quality-gate, sca-quality-gate]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm start & sleep 10

  # DAST - Dynamic Application Security Testing
  dast-scan:
    name: DAST - Dynamic Analysis
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v3
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: http://localhost:3000
      - uses: actions/upload-artifact@v3
        with:
          name: zap-results
          path: report_html.html

  dast-quality-gate:
    name: DAST Quality Gate
    runs-on: ubuntu-latest
    needs: dast-scan
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: zap-results
      - name: Check DAST results
        run: echo "DAST Quality Gate Passed"

  # Final Quality Gate
  final-gate:
    name: Final Security Gate
    runs-on: ubuntu-latest
    needs: [sast-quality-gate, sca-quality-gate, dast-quality-gate]
    steps:
      - run: |
          echo "All security gates passed!"
          echo "Pipeline completed successfully"
