  sca-scan:
    name: SCA - Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: |
          npm audit --audit-level=high || true
          npm audit --json > audit-results.json
      
      - name: Upload audit results
        uses: actions/upload-artifact@v3
        with:
          name: npm-audit-results
          path: audit-results.json

  sca-quality-gate:
    name: SCA Quality Gate
    runs-on: ubuntu-latest
    needs: sca-scan
    steps:
      - name: Download audit results
        uses: actions/download-artifact@v3
        with:
          name: npm-audit-results

      - name: Check for critical vulnerabilities
        run: |
          # Verificar si hay vulnerabilidades críticas
          if grep -q '"severity":"critical"' audit-results.json; then
            echo "Critical vulnerabilities found!"
            exit 1
          fi
          echo "No critical vulnerabilities found"


  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [sast-quality-gate, sca-quality-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start application
        run: |
          npm start &
          sleep 10
        env:
          CI: true

  dast-scan:
    name: DAST - Dynamic Analysis
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: http://localhost:3000
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP results
        uses: actions/upload-artifact@v3
        with:
          name: zap-results
          path: report_html.html

  dast-quality-gate:
    name: DAST Quality Gate
    runs-on: ubuntu-latest
    needs: dast-scan
    steps:
      - name: Download ZAP results
        uses: actions/download-artifact@v3
        with:
          name: zap-results

      - name: Check for high/critical alerts
        run: |
          # Parsear resultados de ZAP
          if grep -q "High" report_html.html || grep -q "Critical" report_html.html; then
            echo "High or Critical vulnerabilities found in DAST scan!"
            exit 1
          fi
          echo "DAST scan passed"
