  # PASO 5: DAST (Análisis Dinámico con OWASP ZAP)
  zap-dast:
    runs-on: ubuntu-latest
    steps:
      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: https://github.com/moratayamk/cafe-chapin-gt
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
